<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Horloge beige</title><style>:root{--tile:#EDE1CF;--tick:#C9AE90;--hand:#B08B68;--hand2:#C7A584;--text:#A07F60;color-scheme:light}html,body{height:100%;margin:0;background:transparent}body{display:grid;place-items:center;font-family:'Nunito','Helvetica Neue',Arial,sans-serif;overflow:hidden}.tile{width:min(100vw,100vh);aspect-ratio:1;background:var(--tile);border-radius:6%}svg{width:100%;height:100%;display:block}.digital{font-size:15px;fill:var(--text);font-variant-numeric:tabular-nums;letter-spacing:.5px}.day{font-size:11px;fill:var(--hand);font-weight:600;letter-spacing:.6px}</style><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&display=swap"></head><body><div class="tile"><svg viewBox="0 0 200 200" aria-label="Horloge"><g id="ticks"></g><line id="h" x1="100" y1="100" x2="100" y2="58" stroke="var(--hand)" stroke-width="2.4" stroke-linecap="round"/><line id="m" x1="100" y1="100" x2="100" y2="38" stroke="var(--hand)" stroke-width="1.6" stroke-linecap="round"/><line id="s" x1="100" y1="108" x2="100" y2="34" stroke="var(--hand2)" stroke-width="0.9" stroke-linecap="round"/><circle cx="100" cy="100" r="2.6" fill="var(--hand)"/><text id="time" class="digital" x="100" y="132" text-anchor="middle">--:--:--</text><text id="day" class="day" x="100" y="148" text-anchor="middle"></text></svg></div><script>const g=document.getElementById('ticks');for(let i=0;i<12;i++){const a=i*30*Math.PI/180,main=i%3===0,r1=main?78:80,r2=main?90:86;const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',100+r1*Math.sin(a));l.setAttribute('y1',100-r1*Math.cos(a));l.setAttribute('x2',100+r2*Math.sin(a));l.setAttribute('y2',100-r2*Math.cos(a));l.setAttribute('stroke','var(--tick)');l.setAttribute('stroke-width',main?1.6:1.1);l.setAttribute('stroke-linecap','round');g.appendChild(l);}const rot=(id,deg)=>document.getElementById(id).setAttribute('transform','rotate('+deg+' 100 100)');const jours=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];const p=n=>String(n).padStart(2,'0');function tick(){const d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();rot('h',(h%12)*30+m*0.5);rot('m',m*6+s*0.1);rot('s',s*6);document.getElementById('time').textContent=p(h)+':'+p(m)+':'+p(s);document.getElementById('day').textContent=jours[d.getDay()];}tick();setInterval(tick,1000);</script></body></html>
